# Development overrides, merged automatically on top of compose.yaml
# by `docker compose` unless COMPOSE_FILE (or -f) is set.
#
# After changing package.json, rebuild and refresh the node_modules volume:
#   docker compose up --build --renew-anon-volumes

services:
  web:
    build:
      context: ./so-clean
      dockerfile: Dockerfile.dev
    image: so-clean:dev
    volumes:
      # Live-reload source code from the host
      - ./so-clean:/app
      # Keep the container's own node_modules and .next instead of the host's
      - /app/node_modules
      - /app/.next
    depends_on:
      rustfs-init:
        condition: service_completed_successfully

  db:
    ports:
      # Expose Postgres to the host (localhost only) for psql / DB GUIs
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"

  # -------------------------------------------------------------------------
  # Local S3-compatible object storage (development only).
  # Production uses Cloudflare R2 through the same S3_* variables.
  # RustFS replaces MinIO, whose images were removed from Docker Hub (Sept 2026).
  #   S3 API:  http://localhost:${RUSTFS_HOST_PORT:-9000}
  #   Console: http://localhost:${RUSTFS_CONSOLE_HOST_PORT:-9001}  (login: S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY)
  # -------------------------------------------------------------------------

  # One-shot: RustFS runs as UID 10001, so the data volume must be owned by it
  rustfs-perms:
    image: alpine:3.22
    command: ["sh", "-c", "chown -R 10001:10001 /data"]
    volumes:
      - rustfs_data:/data

  rustfs:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    environment:
      - RUSTFS_ACCESS_KEY=${S3_ACCESS_KEY_ID}
      - RUSTFS_SECRET_KEY=${S3_SECRET_ACCESS_KEY}
      - RUSTFS_VOLUMES=/data/rustfs0
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_OBS_LOG_DIRECTORY=/data/logs
      # Single local disk instead of a dedicated mount; allowed for local testing only
      - RUSTFS_UNSAFE_BYPASS_DISK_CHECK=true
    ports:
      - "127.0.0.1:${RUSTFS_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully

  # One-shot: create the bucket if it does not exist yet
  rustfs-init:
    image: amazon/aws-cli:2.15.0
    entrypoint: ["sh", "-c"]
    command:
      - >
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket "$$S3_BUCKET"
        || aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket "$$S3_BUCKET"
    environment:
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${S3_REGION}
      - S3_BUCKET=${S3_BUCKET}
    depends_on:
      rustfs:
        condition: service_healthy

volumes:
  rustfs_data:

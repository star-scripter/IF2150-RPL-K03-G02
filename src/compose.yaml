# Base (production) definition.
#
# Docker Compose automatically merges compose.override.yaml on top of this
# file, which switches the web service to the dev server. So:
#
#   Development (default):  docker compose up --build
#   Production:             set COMPOSE_FILE=compose.yaml in .env
#                           (or run: docker compose -f compose.yaml up --build)

services:
  web:
    build:
      context: ./so-clean
      dockerfile: Dockerfile
    image: so-clean:prod
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - SESSION_SECRET=${SESSION_SECRET}
      # Object storage (S3 API): Cloudflare R2 in production, RustFS in development
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_PUBLIC_ENDPOINT=${S3_PUBLIC_ENDPOINT}
      - S3_REGION=${S3_REGION}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      # Postgres 18+ stores data in /var/lib/postgresql/<major>/docker,
      # so the volume must be mounted on the parent directory
      - postgres_data:/var/lib/postgresql
      # Optional: Uncomment to run initialization scripts on first boot
      # - ./init-db:/docker-entrypoint-initdb.d
volumes:
  postgres_data:
